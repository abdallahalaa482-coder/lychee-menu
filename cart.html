<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سلة الطلب | SMASH Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    body{background:#fafafa;padding:0;color:#161312}.cart-page{width:min(100%,430px);min-height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column}.cart-header{height:55px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-bottom:1px solid #eee}.cart-header h1{font-size:16px;margin:0;font-weight:800}.back-button{grid-column:1;justify-self:start;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#f8f8f8;color:#111;text-decoration:none;font-size:22px;line-height:1}.clear-cart{grid-column:3;justify-self:end;border:0;background:none;color:#f56611;font:700 11px inherit;cursor:pointer}.cart-content{padding:4px 12px 0;flex:1}.cart-items{display:grid;gap:14px;margin-top:0}.cart-row{position:relative;min-height:89px;padding:12px;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #ededed;border-radius:14px}.cart-row img{width:52px;height:52px;object-fit:cover;border-radius:50%}.cart-info{align-self:stretch;display:flex;flex-direction:column;justify-content:center}.cart-info h2{font-size:12px;line-height:1.5;margin:0;font-weight:800}.cart-info p{font-size:10px;color:#9b9b9b;margin:3px 0 0}.cart-price{color:#ff610c;font-size:11px;font-weight:800;white-space:nowrap;align-self:end}.remove{position:absolute;left:11px;top:9px;border:0;background:transparent;color:#a9a9a9;font-size:15px;cursor:pointer}.qty-control{grid-column:2;display:flex;align-items:center;gap:9px;margin-top:-13px;width:max-content;background:transparent}.qty-control button{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#fff;border:1px solid #ff610c;color:#ff610c;font-size:16px;line-height:1;cursor:pointer}.qty-control button[data-action="plus"]{background:#ff610c;color:#fff}.qty-control span{font-size:12px;font-weight:700;min-width:10px;text-align:center}.cart-summary{margin-top:auto;padding:10px 7px 12px;border-top:1px solid #eee}.summary-line{display:flex;justify-content:space-between;color:#646464;font-size:11px;padding:5px 0}.summary-total{display:flex;justify-content:space-between;border-top:1px solid #eee;padding-top:11px;margin-top:3px;font-size:13px;font-weight:800}.summary-total strong{color:#ff610c}.checkout{display:block;margin-top:20px;border:0;background:#1fc36f;color:#fff;width:100%;border-radius:14px;padding:16px 10px;text-align:center;text-decoration:none;font:500 12px inherit;cursor:pointer}.checkout::before{content:"◔";font-size:17px;margin-left:9px;vertical-align:-1px}.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 28px 16px}.empty-icon{display:grid;place-items:center;width:158px;height:158px;border:1px solid #ffd8c8;border-radius:36px;color:#ff852f;font-size:62px;margin-bottom:27px}.empty-state h2{font-size:18px;margin:0 0 12px}.empty-state p{color:#656565;font-size:11px;line-height:1.8;margin:0;max-width:260px}.browse-menu{display:block;margin-top:auto;background:#ff651b;color:#fff;width:100%;border-radius:14px;padding:16px;text-align:center;text-decoration:none;font:800 13px inherit}@media(min-width:431px){body{background:#f2f2f2}.cart-page{box-shadow:0 0 32px #0000000c}}
    html,body{width:100%;min-height:100%;overflow-x:hidden}.cart-page{width:min(100%,560px);height:100dvh;min-height:100dvh}.cart-content{display:flex;flex:1;flex-direction:column;min-height:0;padding-bottom:12px}.cart-items{flex:1;overflow-y:auto;padding-top:4px;padding-bottom:10px}.cart-summary{margin-top:auto;flex:0 0 auto;background:#fff}.empty-state{min-height:0;padding-bottom:16px}@media(min-width:561px){body{display:flex;justify-content:center;background:#faf7f3}.cart-page{box-shadow:0 0 32px #0000000c}}@media(max-width:380px){.cart-row{padding:10px;grid-template-columns:48px 1fr auto;gap:7px}.cart-row img{width:46px;height:46px}.cart-info h2{font-size:11px}.checkout{padding:14px 8px}.cart-summary{padding-right:4px;padding-left:4px}}
  </style>
</head>
<body>
  <main class="cart-page">
    <header class="cart-header">
      <a class="back-button" href="index.html" aria-label="العودة للمنيو">›</a>
      <h1>سلة الطلبات</h1>
      <button id="clear-cart" class="clear-cart" type="button">مسح الكل</button>
    </header>
    <section id="cart-content" class="cart-content"></section>
  </main>
  <script src="cart.js"></script>
</body>
</html>
