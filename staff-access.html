<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الموظفين | SMASH Menu</title><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--red:#ed4b23;--ink:#1d1714}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fff7f2;font-family:Alexandria,Arial;color:var(--ink)}.login{width:min(100% - 32px,410px);background:#fff;padding:32px 24px;border:1px solid #f0ddd3;border-radius:16px;box-shadow:0 12px 35px #32160b12;text-align:center}.mark{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;margin:auto;background:#fff0ea;color:var(--red);font-size:25px}.login h1{font-size:21px;margin:18px 0 8px}.login p{font-size:12px;color:#766b65;line-height:1.8;margin:0 0 22px}.login label{text-align:right;display:block;font-size:12px;font-weight:700;margin-bottom:7px}.login input{width:100%;height:48px;border:1px solid #e8d8d0;border-radius:10px;padding:0 12px;font:14px Alexandria;outline-color:var(--red)}.login button{width:100%;height:48px;margin-top:14px;border:0;border-radius:10px;background:var(--red);color:#fff;font:800 13px Alexandria;cursor:pointer}.error{min-height:18px;margin:9px 0 0;color:#cf3215;font-size:11px}.back{display:block;margin-top:17px;color:#766b65;text-decoration:none;font-size:11px}</style></head><body><main class="login"><div class="mark">🔐</div><h1>دخول الموظفين</h1><p>أدخل رمز إدارة المنيو للوصول إلى لوحة التحكم.</p><form id="login-form"><label for="staff-pin">رمز الدخول</label><input id="staff-pin" type="password" inputmode="numeric" autocomplete="current-password" required><button>دخول إلى لوحة الإدارة</button><div id="error" class="error"></div></form><a class="back" href="index.html">العودة إلى المنيو</a></main><script src="admin-auth.js"></script></body></html>
